<!-- meta: title=Contact Us – Gas Integrated Solutions | nav=contact | path=/contact-us/ | slug=contact | desc=Get in touch with Gas Integrated Solutions in Dubai. Call +971 4 883 3967, email business@gasis.ae or send us a message. -->

<section class="page-banner" style="background-image:url('/assets/img/service-maintenance.jpg')">
  <h1>Contact Us</h1>
  <p class="breadcrumb"><a href="/">Home</a> &gt; Contact</p>
</section>

<section class="contact-info container" aria-label="Contact details">
  <a class="contact-info-item" href="tel:+97148833967"><span class="circle-icon">{{icon:phone-alt}}</span><span>+971 4 883 3967</span></a>
  <a class="contact-info-item" href="mailto:business@gasis.ae"><span class="circle-icon">{{icon:envelope}}</span><span>business@gasis.ae</span></a>
  <span class="contact-info-item"><span class="circle-icon">{{icon:map-marker-alt}}</span><span>212, Al Ramool Oasis Bldg, Um Ramool, Dubai</span></span>
</section>

<section class="contact-form-section container" aria-labelledby="contact-title">
  <div class="contact-form-text">
    <p class="eyebrow">Connect with us today.</p>
    <h2 id="contact-title">Ready to experience the Gas Integrated Solutions difference? Get in touch.</h2>
  </div>
  <form class="contact-form" data-form="contact" novalidate>
    <div class="field">
      <label for="form-name">Name</label>
      <input id="form-name" type="text" name="name" placeholder="Name" autocomplete="name">
    </div>
    <div class="field">
      <label for="form-email">Email <span aria-hidden="true">*</span></label>
      <input id="form-email" type="email" name="email" placeholder="Email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="form-message">Message</label>
      <textarea id="form-message" name="message" rows="7" placeholder="Message"></textarea>
    </div>
    <button class="btn" type="submit" data-loading="Sending...">Send</button>
    <p class="form-message" role="status" aria-live="polite"></p>
  </form>
</section>
